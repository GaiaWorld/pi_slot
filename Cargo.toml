[package]
name = "pi_slot"
version = "1.0.0"
authors = ["suncy <530739162@qq.com>"]
edition = "2021"
description = "Stable-address slot map with shared insertion"
repository = "https://github.com/GaiaWorld/pi_slot.git"
license = "MIT OR Apache-2.0"
keywords = ["pi", "slotmap", "stable-address"]
readme = "README.md"
categories = ["data-structures", "memory-management", "caching"]


[dependencies]
pi_arr = { version = "0.31.1", path = "../pi_arr" }
pi_share = "0.6"
pi_key = { version = "=0.1.0", path = "../pi_key", default-features = false }

[features]
rc = ["pi_share/rc", "pi_arr/rc"]

[dev-dependencies]
pi_null = "0.1"
