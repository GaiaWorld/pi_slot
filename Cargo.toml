[package]
name = "pi_slot"
version = "1.0.2"
authors = ["suncy <530739162@qq.com>"]
edition = "2021"
description = "Stable-address slot map with shared insertion"
repository = "https://github.com/GaiaWorld/pi_slot.git"
license = "MIT OR Apache-2.0"
keywords = ["pi", "slotmap"]
readme = "README.md"
categories = ["data-structures", "memory-management", "caching"]


[dependencies]
pi_arr = "0.32"
pi_share = "2.1"
crossbeam-utils = { version = "0.8", optional = true }
pi_key = { version = "0.2", default-features = false }

[features]
default = []
stats = ["dep:crossbeam-utils"]
rc = ["pi_share/rc", "pi_arr/rc"]

[dev-dependencies]
pi_null = "0.2"
